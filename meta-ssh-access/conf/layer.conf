# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ssh-access"
BBFILE_PATTERN_meta-ssh-access = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ssh-access = "6"

LAYERDEPENDS_meta-ssh-access = "core"
LAYERSERIES_COMPAT_meta-ssh-access = "kirkstone"
